name: Build, test and publish app
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.config.outputs.version }}
      image: ${{ steps.config.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: config
        name: Read release version and image from app configuration
        run: |
          python - <<'PYTHON'
          import os, re
          from pathlib import Path
          config = Path('roadviewer/config.yaml').read_text()
          version = re.search(r'^version: "(\d+\.\d+\.\d+)"$', config, re.M)[1]
          image = re.search(r'^image: (ghcr\.io/[a-z0-9._/-]+)$', config, re.M)[1]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nimage={image}\n')
          PYTHON
  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
      - name: Audit application requirements
        run: python -m pip_audit -r roadviewer/requirements.txt
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ffmpeg -f lavfi -i color=c=black:s=160x90:r=10 -t 2 -c:v libx264 -pix_fmt yuv420p /tmp/roadviewer-test.mp4
      - run: node tests/replay_ready.cjs
      - run: node tests/replay_coverage.cjs
      - run: node tests/replay_play_request.cjs
      - run: node tests/choices.cjs
      - run: node tests/display_preferences.cjs
      - run: node tests/concurrency.cjs
      - run: node tests/conversion_controls.cjs
      - run: node tests/bulk_actions.cjs
      - run: node tests/recording_names.cjs
      - run: node tests/storage_devices.cjs
      - run: node tests/pairing_refresh.cjs
      - run: node tests/device_test_page.cjs
      - run: node tests/video_overlay.cjs
      - run: node tests/camera_info.cjs
      - run: node tests/telemetry.cjs
      - run: node tests/replay_layout.cjs
      - run: node tests/upload_timeout.cjs
      - run: node tests/upload_stall.cjs
      - run: node tests/upload_mobile.cjs
      - run: node tests/upload_drop.cjs
  upload-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install flask
      - run: python tests/test_duplicates.py
      - run: python tests/test_upload_recovery.py
      - run: python tests/test_device_api.py
      - run: python tests/test_device_port.py
      - run: python tests/test_device_network.py
      - run: python tests/test_requeue.py
      - run: python tests/test_storage.py
      - run: python tests/test_conversion_controls.py
      - run: python tests/test_timeline.py
      - run: python tests/test_progress.py
      - run: python tests/test_job_progress.py
      - run: python tests/test_processing_queue.py
      - run: python tests/test_overlay.py
      - run: python tests/test_telemetry.py
  build:
    needs: [metadata, dependency-audit]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            ha_arch: amd64
          - arch: arm64
            ha_arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: roadviewer
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BUILD_ARCH=${{ matrix.ha_arch }}
            BUILD_VERSION=${{ needs.metadata.outputs.version }}
          load: true
          tags: roadviewer:test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Verify Home Assistant image metadata
        env:
          EXPECTED_ARCH: ${{ matrix.ha_arch }}
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          docker image inspect roadviewer:test > image.json
          python - <<'PYTHON'
          import json, os
          labels = json.load(open('image.json'))[0]['Config']['Labels']
          assert labels['io.hass.version'] == os.environ['EXPECTED_VERSION']
          assert labels['io.hass.type'] == 'app'
          assert labels['io.hass.arch'] == os.environ['EXPECTED_ARCH']
          PYTHON
      - name: Scan built image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          version: 'v0.74.0'
          scan-type: image
          image-ref: roadviewer:test
          scanners: vuln
          vuln-type: os,library
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - name: API and decoder smoke test
        run: docker run --rm --platform linux/${{ matrix.arch }} -v "$PWD/tests:/tests:ro" --entrypoint python roadviewer:test /tests/smoke.py
      - name: Decoder progress tests
        run: docker run --rm --platform linux/${{ matrix.arch }} -v "$PWD/tests:/tests:ro" --entrypoint python roadviewer:test /tests/test_decoder_progress.py
      - name: Speed alignment tests
        run: docker run --rm --platform linux/${{ matrix.arch }} -v "$PWD/tests:/tests:ro" --entrypoint python roadviewer:test /tests/test_speed.py

      - name: Steering replay tests
        run: docker run --rm --platform linux/${{ matrix.arch }} -v "$PWD/tests:/tests:ro" --entrypoint python roadviewer:test /tests/test_steering.py

      - name: Duplicate upload tests
        run: docker run --rm --platform linux/${{ matrix.arch }} -v "$PWD/tests:/tests:ro" --entrypoint python roadviewer:test /tests/test_duplicates.py

      - name: Device HTTPS isolation tests
        run: docker run --rm --platform linux/${{ matrix.arch }} -v "$PWD/tests:/tests:ro" --entrypoint python roadviewer:test /tests/test_device_tls.py

      - name: Log in to GitHub Container Registry
        if: github.repository == 'Qualified4/roadviewer-ha' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested platform image
        if: github.repository == 'Qualified4/roadviewer-ha' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
          SOURCE_SHA: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          tag="$IMAGE:build-$SOURCE_SHA-$ARCH"
          docker tag roadviewer:test "$tag"
          docker push "$tag"

  publish:
    needs: [metadata, dependency-audit, browser-tests, upload-tests, build]
    if: github.repository == 'Qualified4/roadviewer-ha' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      packages: write
    concurrency:
      group: publish-${{ needs.metadata.outputs.version }}
      cancel-in-progress: false
    env:
      IMAGE: ${{ needs.metadata.outputs.image }}
      VERSION: ${{ needs.metadata.outputs.version }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify public access before publishing release
        run: |
          anonymous_config="$(mktemp -d)"
          trap 'rm -rf "$anonymous_config"' EXIT
          for arch in amd64 arm64; do
            if ! docker --config "$anonymous_config" manifest inspect "$IMAGE:build-$SOURCE_SHA-$arch" > /dev/null; then
              echo "::error::Make the GHCR roadviewer-ha package public, then rerun this job. Home Assistant must be able to pull without credentials."
              exit 1
            fi
          done
      - name: Publish multi-platform release
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::notice::Version $VERSION is already published; keeping the existing image. Use a new version for new releases."
            exit 0
          fi
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            "$IMAGE:build-$SOURCE_SHA-amd64" \
            "$IMAGE:build-$SOURCE_SHA-arm64"
      - name: Verify release platforms without registry credentials
        run: |
          anonymous_config="$(mktemp -d)"
          trap 'rm -rf "$anonymous_config"' EXIT
          docker --config "$anonymous_config" manifest inspect "$IMAGE:$VERSION" > manifest.json
          python - <<'PYTHON'
          import json
          from pathlib import Path
          manifest = json.loads(Path('manifest.json').read_text())
          platforms = {(item['platform']['os'], item['platform']['architecture']) for item in manifest['manifests']}
          assert platforms == {('linux', 'amd64'), ('linux', 'arm64')}, platforms
          PYTHON
