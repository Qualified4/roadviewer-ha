name: Road Viewer
version: "1.0.6"
slug: roadviewer
image: ghcr.io/qualified4/roadviewer-ha
description: Openpilot 로그 업로드, 목록, 영상·도로 재생 및 삭제
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:road-variant
panel_title: Road Viewer
options:
  max_upload_mb: 512
  device_certfile: fullchain.pem
  device_keyfile: privkey.pem
  archive_gdrive_client_id: ""
  archive_gdrive_client_secret: ""
schema:
  max_upload_mb: int(16,2048)
  device_certfile: str
  device_keyfile: str
  # Deprecated, read once for migration, to be removed from the schema in a later release.
  archive_enabled: bool?
  archive_path: str?
  archive_local_threshold_mb: int(0,)?
  archive_min_age_hours: int(0,8760)?
  archive_interval_minutes: int(1,1440)?
  archive_batch: int(1,64)?
  archive_nas_max_mb: int(0,)?
  archive_nas_margin_mb: int(0,)?
  archive_backend: list(smb|gdrive)?
  archive_mode: list(move|copy)?
  archive_allow_local_delete: bool?
  archive_gdrive_client_id: str
  archive_gdrive_client_secret: password
  archive_gdrive_folder_name: str?
url: https://github.com/Qualified4/roadviewer-ha
# Recording folders are named with a 32-character hexadecimal ID.
# Preserve options.json and roadviewer/.processing-settings.json.
backup_exclude:
  - "roadviewer/[0-9a-f]*"
  - "roadviewer/.uploads*"
  - "roadviewer/.upload-*"
  - "roadviewer/.picker-diagnostics*"

# Optional HTTPS device API; Ingress remains on its private 8099 listener.
ports:
  8443/tcp: null
ports_description:
  8443/tcp: HTTPS 장치 API · Road Viewer의 외부 장치 연결에서 설정
map:
  - type: ssl
    read_only: true
  - type: share
    read_only: false
