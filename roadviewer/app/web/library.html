<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Road Viewer · 로그 라이브러리</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/library.css"></head><body><main>
<header><div><div class="eyebrow">ROAD VIEWER / HOME ASSISTANT</div><h1>로그 라이브러리</h1></div><span id="summary">목록 불러오는 중…</span></header>
<section class="upload"><h2>로그 업로드</h2><p>로그와 영상을 함께 선택하세요. 여러 구간의 <code>루트--구간--rlog.zst</code>, <code>루트--구간--qcamera.ts</code> 파일도 한 번에 올릴 수 있습니다.</p><div class="upload-row"><label class="file-button">파일 선택<input id="files" type="file" multiple accept=".zst,.ts"></label><label class="file-button secondary">폴더 선택<input id="folder" type="file" multiple webkitdirectory></label><button id="upload" class="primary" disabled>업로드</button><span id="selection">선택한 파일 없음</span></div><progress id="progress" max="100" value="0" hidden></progress><p id="uploadStatus" role="status"></p><div id="error" role="alert" hidden></div></section>
<section class="library"><div class="library-head"><h2>저장된 로그</h2><button id="refresh">새로고침</button></div><div id="empty" hidden>아직 저장된 로그가 없습니다. 위에서 첫 로그를 업로드하세요.</div><div id="list"></div></section>
<footer>Home Assistant 연결을 통해 접근합니다. 업로드한 원본과 변환 데이터는 앱 저장소에 보관됩니다.</footer></main><script src="assets/library.js"></script></body></html>
